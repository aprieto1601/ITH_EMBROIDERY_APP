<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador ITH - MVP Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <!-- jsPDF para generar el PDF en el navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- PDF.js para leer PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-4 md:p-8 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-2xl bg-white p-6 md:p-10 rounded-3xl shadow-sm border border-slate-200">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-600 mb-2">Generador ITH (MVP)</h1>
            <p class="text-slate-500">Convierte imágenes de costura a secuencias de bordado In The Hoop.</p>
        </div>

        <!-- Sección de Configuración -->
        <div id="setup-section" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">1. API Key de Gemini</label>
                <input type="password" id="api-key-input" placeholder="Pega tu API Key de Google AI Studio aquí..." class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
                <p class="text-xs text-slate-400 mt-1">Necesaria para procesar la imagen con IA directamente desde tu navegador.</p>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">2. Imagen del Proyecto</label>
                <input type="file" id="image-input" accept="image/*" class="w-full p-3 border border-slate-200 rounded-xl file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">3. Instrucciones (Opcional)</label>
                <input type="file" id="instructions-input" accept=".txt,.pdf" class="w-full p-3 border border-slate-200 rounded-xl file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-slate-50 file:text-slate-700 hover:file:bg-slate-100">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">4. Patrones/Moldes (Opcional)</label>
                <input type="file" id="patterns-input" accept="image/*,.pdf" class="w-full p-3 border border-slate-200 rounded-xl file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-slate-50 file:text-slate-700 hover:file:bg-slate-100">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Tipo de Proyecto</label>
                    <select id="project-type-input" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50">
                        <option value="3d-project">Proyecto 3D (Bolso, etc.)</option>
                        <option value="quiet-book">Quiet Book / Actividad</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Material Principal</label>
                    <select id="material-input" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50">
                        <option value="Algodón">Algodón</option>
                        <option value="Fieltro">Fieltro</option>
                        <option value="Denim">Denim / Mezclilla</option>
                        <option value="Poliéster">Poliéster</option>
                        <option value="Lona">Lona</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Método de Aplique</label>
                    <select id="applique-input" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50">
                        <option value="trim-in-place">Cortar durante el bordado (Trim-in-place)</option>
                        <option value="pre-cut">Telas pre-cortadas (Cricut/ScanNCut)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Bastidor</label>
                    <select id="hoop-input" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50">
                        <option value="4x4">4" x 4"</option>
                        <option value="5x7" selected>5" x 7"</option>
                        <option value="6x10">6" x 10"</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-2">Formato</label>
                    <select id="format-input" class="w-full p-3 border border-slate-200 rounded-xl bg-slate-50">
                        <option value=".PES">.PES</option>
                        <option value=".EMB">.EMB</option>
                    </select>
                </div>
                
                <div class="col-span-2 mt-2">
                    <label class="flex items-center space-x-3 cursor-pointer">
                        <input type="checkbox" id="multi-position-input" class="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500">
                        <span class="text-sm font-bold text-slate-700">Usar bastidor multi-posición</span>
                    </label>
                </div>
                
                <div id="dimensions-container" class="col-span-2 grid grid-cols-2 gap-4 hidden p-4 bg-indigo-50 rounded-xl border border-indigo-100">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Ancho Final (cm)</label>
                        <input type="number" id="width-input" min="0" step="0.1" placeholder="Ej. 30" class="w-full p-3 border border-slate-200 rounded-xl bg-white">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Alto Final (cm)</label>
                        <input type="number" id="height-input" min="0" step="0.1" placeholder="Ej. 20" class="w-full p-3 border border-slate-200 rounded-xl bg-white">
                    </div>
                </div>
            </div>

            <button id="generate-btn" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 transition-colors mt-4">
                Analizar y Generar Proyecto
            </button>
        </div>

        <!-- Sección de Carga -->
        <div id="loading-section" class="hidden text-center py-12">
            <div class="loader mx-auto mb-6"></div>
            <h3 class="text-xl font-bold text-slate-800">Analizando con Inteligencia Artificial...</h3>
            <p class="text-slate-500 mt-2">Esto puede tomar unos segundos.</p>
        </div>

        <!-- Sección de Resultados -->
        <div id="results-section" class="hidden">
            <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-8 text-center">
                <h2 class="text-xl font-bold text-emerald-700">¡Análisis Completado!</h2>
            </div>

            <div class="mb-8">
                <h3 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Resumen del Proyecto</h3>
                <div id="analysis-output" class="bg-slate-50 p-5 rounded-xl text-sm space-y-2 border border-slate-100">
                    <!-- Contenido dinámico -->
                </div>
            </div>

            <div class="mb-8">
                <h3 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Secuencia ITH</h3>
                <div id="sequence-output" class="space-y-4">
                    <!-- Contenido dinámico -->
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-8">
                <button id="download-emb-btn" class="flex items-center justify-center gap-2 bg-indigo-600 text-white font-bold py-4 rounded-xl hover:bg-indigo-700 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Archivo de Bordado
                </button>
                <button id="download-pdf-btn" class="flex items-center justify-center gap-2 bg-rose-500 text-white font-bold py-4 rounded-xl hover:bg-rose-600 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    Instrucciones PDF
                </button>
            </div>
            
            <div id="svg-download-container" class="mt-4 hidden">
                <button id="download-svg-btn" class="w-full flex items-center justify-center gap-2 bg-fuchsia-600 text-white font-bold py-4 rounded-xl hover:bg-fuchsia-700 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                    Archivo de Corte (.SVG)
                </button>
            </div>

            <button id="restart-btn" class="w-full mt-4 bg-white border border-slate-300 text-slate-600 font-bold py-4 rounded-xl hover:bg-slate-50 transition-colors">
                Empezar Nuevo Proyecto
            </button>
        </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
